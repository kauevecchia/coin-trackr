name: Crypto Price Update

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  trigger-price-update:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger price update
        run: |
          curl -X POST https://coin-trackr.onrender.com/admin/cron/trigger \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            --fail-with-body \
            -s \
            | echo "Response: $(cat)"
